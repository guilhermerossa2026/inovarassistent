<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inovar Assistente - Protótipo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #0a0a0a;
      /* Fundo principal super escuro */
      --bg-panel: #111111;
      /* Fundo dos painéis */
      --bg-input: #1a1a1a;
      /* Fundo dos inputs */
      --text-primary: #ffffff;
      /* Texto principal */
      --text-secondary: #a0a0a0;
      /* Texto secundário */
      /* NOVA COR DE DESTAQUE: Vermelho Inovar */
      --inovar-red: #E60000;
      /* Vermelho vibrante da marca */
      --inovar-red-glow: rgba(230, 0, 0, 0.3);
      /* Brilho do vermelho */
      --border-color: #333333;
      /* Cor das bordas */
      --success-color: var(--inovar-red);
      /* Sucesso agora é vermelho */
      --warning-color: #ffcc00;
      --danger-color: #ff3333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* Efeito de grid sutil no fundo para o visual técnico */
      background-image:
        linear-gradient(var(--border-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
      background-size: 50px 50px;
      background-position: center center;
    }

    /* Container principal do app, simulando uma janela flutuante */
    .app-container {
      width: 90%;
      max-width: 1000px;
      height: 85vh;
      background-color: var(--bg-panel);
      border-radius: 16px;
      /* Borda e sombra vermelha para o efeito imersivo */
      border: 1px solid var(--inovar-red);
      box-shadow: 0 0 40px var(--inovar-red-glow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Efeito de scanline na tela para o visual cyberpunk */
    .app-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg,
          rgba(0, 0, 0, 0.15) 0px,
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 4px);
      pointer-events: none;
      z-index: 10;
      opacity: 0.5;
    }

    /* Cabeçalho da aplicação */
    .app-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(17, 17, 17, 0.8);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Logotipo da Inovar */
    .brand-logo {
      height: 40px;
      /* Altura ajustada para a logo */
      width: auto;
    }

    .brand-name {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      color: var(--inovar-red);
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
    }

    .lightning-bolt {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--inovar-red);
      animation: bolt-glow 2s infinite ease-in-out, bolt-shock 3s infinite linear;
    }

    .lightning-bolt svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      filter: drop-shadow(0 0 4px var(--inovar-red));
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    @keyframes bolt-glow {

      0%,
      100% {
        filter: drop-shadow(0 0 4px var(--inovar-red));
        opacity: 0.8;
      }

      50% {
        filter: drop-shadow(0 0 12px var(--inovar-red)) drop-shadow(0 0 20px var(--inovar-red));
        opacity: 1;
      }
    }

    @keyframes bolt-shock {

      0%,
      85%,
      89%,
      93%,
      100% {
        opacity: 1;
        color: var(--inovar-red);
      }

      86%,
      90% {
        opacity: 0.3;
        color: #ff6666;
      }

      88%,
      92% {
        opacity: 0.7;
      }
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      background-color: var(--inovar-red);
      /* Indicador vermelho */
      border-radius: 50%;
      box-shadow: 0 0 10px var(--inovar-red);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 0.6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }

      100% {
        opacity: 0.6;
        transform: scale(1);
      }
    }

    /* Área principal do chat e conteúdo */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Área de mensagens com scroll */
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      scroll-behavior: smooth;
    }

    /* Estilos das mensagens */
    .message {
      max-width: 85%;
      animation: fade-in 0.3s ease-out;
    }

    .message-user {
      align-self: flex-end;
      background-color: var(--inovar-red);
      /* Mensagem do usuário em vermelho */
      color: var(--text-primary);
      /* Texto branco sobre o vermelho */
      padding: 1rem 1.5rem;
      border-radius: 16px 16px 4px 16px;
      font-weight: 500;
    }

    .message-bot {
      align-self: flex-start;
    }

    .bot-avatar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      color: var(--inovar-red);
      /* Nome do bot em vermelho */
    }

    .bot-icon {
      width: 28px;
      height: 28px;
      /* Ícone da Inovar no avatar */
      background-image: url('Inovar Marca Com Iconeico.png');
      background-size: cover;
      border-radius: 50%;
      border: 1px solid var(--inovar-red);
    }

    .bot-response-container {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 4px 16px 16px 16px;
      padding: 1.5rem;
    }

    .bot-response-text {
      line-height: 1.6;
      color: var(--text-primary);
    }

    /* Estilos para elementos dentro da resposta do bot (Markdown simulado) */
    .bot-response-text strong {
      color: var(--inovar-red);
      /* Negrito em vermelho */
      font-weight: 700;
    }

    .bot-response-text code {
      font-family: 'JetBrains Mono', monospace;
      background-color: rgba(230, 0, 0, 0.1);
      /* Fundo vermelho claro */
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      color: var(--inovar-red);
      /* Texto do código em vermelho */
      font-size: 0.9em;
    }

    .bot-response-text pre {
      background-color: #000;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      margin: 1rem 0;
    }

    .bot-response-text pre code {
      background-color: transparent;
      padding: 0;
      color: var(--inovar-red);
      /* Bloco de código em vermelho */
    }

    .bot-response-text ul {
      margin: 1rem 0 1rem 1.5rem;
    }

    .bot-response-text li {
      margin-bottom: 0.5rem;
    }

    /* Marcador de lista em vermelho */
    .bot-response-text ul li::marker {
      color: var(--inovar-red);
    }

    /* Rodapé da resposta com ações */
    .bot-response-actions {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 1rem;
    }

    .action-button {
      background-color: rgba(230, 0, 0, 0.1);
      /* Fundo vermelho claro */
      color: var(--inovar-red);
      /* Texto vermelho */
      border: 1px solid var(--inovar-red);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-button:hover {
      background-color: var(--inovar-red);
      /* Fundo vermelho no hover */
      color: var(--bg-app);
      /* Texto escuro no hover */
      box-shadow: 0 0 15px var(--inovar-red-glow);
    }

    /* Área de input do usuário */
    .input-area {
      padding: 1.5rem 2rem;
      background-color: rgba(17, 17, 17, 0.9);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color);
      position: relative;
      z-index: 20;
    }

    .input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .chat-input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      padding-right: 4rem;
      border-radius: 12px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: all 0.3s;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--inovar-red);
      /* Borda vermelha ao focar */
      box-shadow: 0 0 0 3px var(--inovar-red-glow);
    }

    .chat-input::placeholder {
      color: var(--text-secondary);
    }

    .send-button {
      position: absolute;
      right: 0.75rem;
      background-color: var(--inovar-red);
      /* Botão de enviar vermelho */
      color: var(--bg-app);
      /* Ícone escuro */
      border: none;
      width: 3rem;
      height: 3rem;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .send-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px var(--inovar-red-glow);
    }

    .send-button:disabled {
      background-color: var(--border-color);
      color: var(--text-secondary);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Indicador de carregamento */
    .loading-indicator {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      align-self: flex-start;
    }

    .loading-dot {
      width: 8px;
      height: 8px;
      background-color: var(--inovar-red);
      /* Pontos de loading vermelhos */
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading-dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .loading-dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(0);
      }

      40% {
        transform: scale(1);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Estilização da barra de rolagem */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-panel);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--inovar-red);
      /* Scrollbar hover vermelho */
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Cabeçalho do App -->
    <header class="app-header">
      <div class="brand">
        <!-- Logo da Inovar -->
        <img src="/img/Inovarlogo.png" alt="Logo Inovar" class="brand-logo">

        <div class="lightning-bolt">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>

      </div>
      <div class="header-status">
        <span class="status-indicator"></span>
        <span>SISTEMA OPERACIONAL | BASE DE CONHECIMENTO V.1.2</span>
      </div>
    </header>

    <!-- Área de Conteúdo -->
    <main class="app-content">
      <!-- Histórico de Conversa -->
      <div class="chat-history" id="chat-history">
        <!-- Mensagem inicial do bot -->
        <div class="message message-bot">
          <div class="bot-avatar">
            <div class="bot-icon"></div>
            <span>INOVAR.AI</span>
          </div>
          <div class="bot-response-container">
            <div class="bot-response-text">
              Olá, técnico. Sou o assistente inteligente da <strong>Inovar</strong>.
              <br><br>
              Estou conectado à nossa base de conhecimento central. Como posso te ajudar a resolver o chamado de hoje?
            </div>
          </div>
        </div>
        <!-- As mensagens novas aparecerão aqui -->
      </div>

      <!-- Área de Input -->
      <div class="input-area">
        <div class="input-container">
          <input type="text" id="chat-input" class="chat-input" placeholder="Descreva o problema do cliente ou cole um código de erro..." autocomplete="off">
          <button id="send-button" class="send-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');
    const chatHistory = document.getElementById('chat-history');

    // Função para adicionar mensagem do usuário
    function addUserMessage(text) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message message-user';
      messageDiv.textContent = text;
      chatHistory.appendChild(messageDiv);
      scrollToBottom();
    }

    // Função para adicionar indicador de carregamento
    function addLoadingIndicator() {
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message loading-indicator';
      loadingDiv.id = 'loading-indicator';
      loadingDiv.innerHTML = '<div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>';
      chatHistory.appendChild(loadingDiv);
      scrollToBottom();
      return loadingDiv;
    }

    // Função para remover indicador de carregamento
    function removeLoadingIndicator(indicator) {
      if (indicator && indicator.parentNode) {
        indicator.parentNode.removeChild(indicator);
      }
    }

    // Função para adicionar resposta do bot (simulada)
    function addBotResponse(text) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message message-bot';

      let responseHTML = `
                <div class="bot-avatar">
                    <div class="bot-icon"></div>
                    <span>INOVAR.AI</span>
                </div>
                <div class="bot-response-container">
                    <div class="bot-response-text">
                        ${text} <!-- O texto já vem formatado com HTML simulado -->
                    </div>
                    <div class="bot-response-actions">
                        <button class="action-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copiar Solução
                        </button>
                        <button class="action-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            Marcar como Resolvido
                        </button>
                    </div>
                </div>
            `;

      messageDiv.innerHTML = responseHTML;
      chatHistory.appendChild(messageDiv);
      scrollToBottom();
    }

    // Função para rolar o chat para o final
    function scrollToBottom() {
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // Simulação de resposta da IA (Substituir por chamada real à API no futuro)
    function simulateAIResponse(userText) {
      const loading = addLoadingIndicator();

      // Simula um tempo de "pensamento" da IA (1.5 a 3 segundos)
      const delay = Math.random() * 1500 + 1500;

      setTimeout(() => {
        removeLoadingIndicator(loading);

        let responseText = "";
        // Respostas simuladas baseadas em palavras-chave simples
        if (userText.toLowerCase().includes('timeout') && userText.toLowerCase().includes('nf-e')) {
          responseText = `
                        Encontrei um procedimento para <strong>Erro de Timeout na Emissão de NF-e</strong> na base de conhecimento.
                        <br><br>
                        Isso geralmente ocorre por instabilidade na SEFAZ ou bloqueio no firewall do cliente. Siga os passos abaixo:
                        <br><br>
                        <ul>
                            <li>Verifique se o serviço da SEFAZ está operante no portal nacional.</li>
                            <li>No servidor do cliente, abra o <strong>CMD</strong> como administrador e execute o teste de ping:</li>
                        </ul>
                        <pre><code>ping nfe.sefaz.rs.gov.br -t</code></pre>
                        <ul>
                            <li>Se houver perda de pacotes, verifique as regras de saída do firewall para a porta <code>443</code>.</li>
                            <li>Se o ping estiver normal, reinicie o serviço do nosso integrador fiscal:</li>
                        </ul>
                        <pre><code>net stop InovarFiscal
net start InovarFiscal</code></pre>
                    `;
        } else if (userText.toLowerCase().includes('banco') || userText.toLowerCase().includes('deadlock')) {
          responseText = `
                        Identifiquei um possível cenário de <strong>Deadlock no Banco de Dados</strong>.
                        <br><br>
                        Isso pode travar as operações do PDV. Para diagnosticar e liberar os processos presos, execute a seguinte query no Management Studio do cliente:
                        <br><br>
                        <pre><code>-- Identificar processos bloqueados
SELECT
    spid,
    blocked,
    waittime,
    lastwaittype,
    status,
    cmd
FROM sys.sysprocesses
WHERE blocked > 0;</code></pre>
                        Após identificar o ID do processo bloqueador (na coluna <code>blocked</code>), você pode derrubá-lo com o comando:
                        <pre><code>KILL [ID_DO_PROCESSO]; -- Ex: KILL 54;</code></pre>
                        <strong>Atenção:</strong> Execute o KILL apenas se tiver certeza de que não é um processo crítico de fechamento de caixa.
                    `;
        } else {
          responseText = `
                        Não encontrei uma solução exata para <strong>"${userText}"</strong> nos manuais que tenho acesso no momento.
                        <br><br>
                        Tente ser mais específico na descrição do erro ou do módulo. Por exemplo:
                        <ul>
                            <li>"Erro 500 ao finalizar venda no PDV"</li>
                            <li>"Como configurar a balança Filizola"</li>
                        </ul>
                        Se o problema for crítico, recomendo acionar o gerente de suporte imediatamente.
                    `;
        }

        addBotResponse(responseText);
      }, delay);
    }

    // Event Listeners
    sendButton.addEventListener('click', () => {
      const text = chatInput.value.trim();
      if (text) {
        addUserMessage(text);
        chatInput.value = '';
        simulateAIResponse(text);
      }
    });

    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendButton.click();
      }
    });

    // Desabilitar botão se input estiver vazio
    chatInput.addEventListener('input', () => {
      sendButton.disabled = chatInput.value.trim() === '';
    });
    sendButton.disabled = true; // Estado inicial

  </script>
</body>

</html>
